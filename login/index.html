<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In | Minorities in STEM</title>
    <meta name="description" content="Log in to the Minorities in STEM community board.">
    <link rel="stylesheet" href="/assets/styles.css">
    <script src="/assets/site.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div id="site-header"></div>
    <main id="main">
      <section class="section section-alt" aria-labelledby="login-heading">
        <div class="container contact-layout">
          <div class="content-stack login-copy">
            <p class="eyebrow">Log In</p>
            <h1 id="login-heading" class="compact-page-title">Access your community board.</h1>
            <p class="lead">Log in with email/username and password. Create Account includes email, username, password, and optional school/chapter.</p>
          </div>
          <form class="contact-card form-grid" data-login-form>
            <div class="auth-mode-toggle" role="tablist" aria-label="Account action">
              <button class="auth-mode-button is-active" type="button" data-auth-mode="signin" role="tab" aria-selected="true">Log In</button>
              <button class="auth-mode-button" type="button" data-auth-mode="signup" role="tab" aria-selected="false">Create Account</button>
            </div>

            <div class="form-row" data-auth-field="signin">
              <label for="login-identifier">Email/Username</label>
              <input id="login-identifier" name="identifier" autocomplete="username" placeholder="name@example.com or username">
            </div>
            <div class="form-row" data-auth-field="signup" hidden>
              <label for="login-email">Email</label>
              <input id="login-email" name="email" type="email" autocomplete="email" placeholder="name@example.com">
            </div>
            <div class="form-row" data-auth-field="signup" hidden>
              <label for="login-username">Username</label>
              <input id="login-username" name="username" autocomplete="username" placeholder="yourname">
            </div>
            <div class="form-row">
              <label for="login-password">Password</label>
              <input id="login-password" name="password" type="password" autocomplete="current-password" minlength="6" required>
            </div>
            <div class="form-row" data-auth-field="signup" hidden>
              <label for="login-school-chapter">School or Chapter</label>
              <input id="login-school-chapter" name="school_chapter" autocomplete="organization" placeholder="Woodward Academy">
            </div>
            <input type="hidden" name="action" value="signin" data-auth-action>
            <button class="button" type="submit" data-auth-submit>Log In</button>
            <div class="form-actions auth-secondary-actions">
              <button class="text-button" type="button" data-reset-password>Forgot Password?</button>
              <button class="text-button" type="button" data-update-password hidden>Update Password</button>
              <button class="text-button" type="button" data-logout hidden>Log Out</button>
            </div>
            <p class="form-note" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
  </body>
</html>
